---
spring:
  config:
    activate:
      on-profile: prod
iot:
  video:
    zlmedia:
      # 后端调用 ZLMediaKit API 的地址（内网，服务器能访问即可）
      api-url: ${ZLM_API_URL:http://192.168.1.246:80}
      secret: ${ZLM_SECRET:S3KXbjxEBlU9GCnBkVJaaEsdVmEHNzRW}
      http-port: 80
      # 公网访问配置（返回给前端的播放地址）
      public-host: ${ZLM_PUBLIC_HOST:ibms.gzchanghui.cn}
      public-http-port: ${ZLM_PUBLIC_HTTP_PORT:80}
      # WebRTC 公网配置：ICE 候选由 ZLMediaKit 的 rtc.externIP/rtc.port 返回
      # 当前 ZLM 侧配置为 externIP=5a80f2d26da91f80.natapp.cc、rtc.port=5000
      # 注意：/index/api/webrtc 信令仍走 public-host/public-http-port，不要把 UDP 隧道域名写入 public-rtc-host












