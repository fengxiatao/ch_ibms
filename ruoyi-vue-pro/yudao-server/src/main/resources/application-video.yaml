# IoT 视频流配置
iot:
  video:
    # ZLMediaKit 流媒体服务配置
    zlmedia:
      # ZLMediaKit API地址 (HTTP API) - 后端调用 ZLMediaKit 的地址（内网）
      api-url: http://192.168.1.246:80
      # ZLMediaKit API密钥
      secret: ${ZLM_SECRET:S3KXbjxEBlU9GCnBkVJaaEsdVmEHNzRW}
      # ZLMediaKit HTTP端口 (内网端口)
      http-port: 80
      # WebRTC 信令端口（ZLM config.ini: signalingPort）
      signaling-port: ${ZLM_SIGNALING_PORT:3000}
      # RTSP 端口 (Docker映射 8554->554)
      rtsp-port: 8554
      # RTMP 端口
      rtmp-port: 1935
      # WebRTC 端口（ZLM config.ini: rtc.port / tcpPort，当前通过 NATAPP 映射 5000）
      rtc-port: 5000
      # 公网访问配置（用于生成播放地址，让外网用户能访问）
      public-host: ${ZLM_PUBLIC_HOST:ibms.gzchanghui.cn}
      public-http-port: ${ZLM_PUBLIC_HTTP_PORT:80}
      # 公网 WebRTC 信令端口（默认与 signaling-port 相同）
      public-signaling-port: ${ZLM_PUBLIC_SIGNALING_PORT:${ZLM_SIGNALING_PORT:3000}}
    
    # 视频流超时时间（分钟）
    stream-timeout-minutes: 30
    
    # FFmpeg 配置 (备用，当前使用ZLMediaKit)
    ffmpeg-path: ffmpeg
    hls-output-dir: /var/www/hls
    hls-segment-duration: 5
    hls-list-size: 10

---
spring:
  config:
    activate:
      on-profile: local
iot:
  video:
    zlmedia:
      api-url: http://192.168.1.246:80
      secret: S3KXbjxEBlU9GCnBkVJaaEsdVmEHNzRW
      http-port: 80

