<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件分析 - 工厂AI视频合规管控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0e1a;
            --bg-panel: rgba(15, 23, 42, 0.85);
            --border-color: rgba(148, 163, 184, 0.15);
            --compliance-green: #10b981;
            --warning-yellow: #f59e0b;
            --violation-red: #ef4444;
            --info-blue: #3b82f6;
        }
        body { background: var(--bg-primary); color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel { background: var(--bg-panel); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; }

        .sidebar-menu-item { padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; color: #94a3b8; }
        .sidebar-menu-item:hover { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .sidebar-menu-item.active { background: rgba(59,130,246,0.25); color: #60a5fa; }

        .stat-card { background: linear-gradient(135deg, rgba(59,130,246,0.1) 0%, rgba(139,92,246,0.1) 100%); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; padding: 20px; }

        .chart-container { position: relative; height: 280px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30,41,59,0.5); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- 左侧边栏 -->
    <aside class="w-72 bg-slate-900/80 border-r border-gray-800 flex flex-col shrink-0 overflow-y-auto">
        <div class="p-5 border-b border-gray-800">
            <div class="flex items-center gap-2">
                <i class="fas fa-shield-alt text-2xl text-blue-500"></i>
                <div>
                    <h1 class="text-lg font-bold">工厂AI视频合规管控</h1>
                    <p class="text-xs text-gray-500">智能合规事件管理平台</p>
                </div>
            </div>
        </div>

        <div class="px-4 py-3 border-t border-gray-800">
            <div class="text-xs text-gray-500 uppercase mb-2 font-semibold">功能模块</div>
            <div class="space-y-1">
                <div class="sidebar-menu-item" onclick="location.href='monitor.html'">
                    <i class="fas fa-desktop text-gray-400"></i>
                    <span class="text-sm">实时监控</span>
                </div>
                <div class="sidebar-menu-item" onclick="location.href='alerts.html'">
                    <i class="fas fa-bell text-gray-400"></i>
                    <span class="text-sm">实时告警</span>
                </div>
                <div class="sidebar-menu-item" onclick="location.href='events.html'">
                    <i class="fas fa-database text-gray-400"></i>
                    <span class="text-sm">事件管理</span>
                </div>
                <div class="sidebar-menu-item active">
                    <i class="fas fa-chart-line text-green-400"></i>
                    <span class="text-sm">事件分析</span>
                </div>
                <div class="sidebar-menu-item" onclick="location.href='personnel.html'">
                    <i class="fas fa-users text-gray-400"></i>
                    <span class="text-sm">人员档案管理</span>
                </div>
            </div>
        </div>

        <div class="mt-auto p-4 border-t border-gray-800">
            <div class="grid grid-cols-3 gap-2 text-center">
                <div><div class="text-lg font-bold text-blue-400">6</div><div class="text-xs text-gray-500">监控点位</div></div>
                <div><div class="text-lg font-bold text-green-400">5</div><div class="text-xs text-gray-500">合规规则</div></div>
                <div><div class="text-lg font-bold text-purple-400">13</div><div class="text-xs text-gray-500">在场人员</div></div>
            </div>
        </div>
    </aside>

    <!-- 主内容区：事件分析 -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <div class="p-6 border-b border-gray-800 bg-slate-900/30">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold flex items-center gap-2">
                        <i class="fas fa-chart-line text-green-400"></i>事件分析
                    </h2>
                    <p class="text-gray-500 text-sm mt-1">合规数据统计与趋势分析</p>
                </div>
                <div class="flex gap-2">
                    <select id="timeRange" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" onchange="updateCharts()">
                        <option value="7">最近7天</option>
                        <option value="30">最近30天</option>
                        <option value="month">本月</option>
                    </select>
                    <button class="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600">
                        <i class="fas fa-download mr-1"></i>导出报告
                    </button>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            <!-- 统计卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="stat-card">
                    <div class="text-3xl font-bold text-blue-400">93.8%</div>
                    <div class="text-sm text-gray-400">平均合规率</div>
                    <div class="text-xs text-green-400 mt-1"><i class="fas fa-arrow-up"></i> +2.3%</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, rgba(239,68,68,0.1) 0%, rgba(239,68,68,0.05) 100%); border-color: rgba(239,68,68,0.2);">
                    <div class="text-3xl font-bold text-red-400">156</div>
                    <div class="text-sm text-gray-400">本月违规事件</div>
                    <div class="text-xs text-red-400 mt-1"><i class="fas fa-arrow-up"></i> +12</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, rgba(245,158,11,0.1) 0%, rgba(245,158,11,0.05) 100%); border-color: rgba(245,158,11,0.2);">
                    <div class="text-3xl font-bold text-yellow-400">89</div>
                    <div class="text-sm text-gray-400">待处理事件</div>
                    <div class="text-xs text-yellow-400 mt-1"><i class="fas fa-exclamation-circle"></i> 需关注</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, rgba(16,185,129,0.05) 100%); border-color: rgba(16,185,129,0.2);">
                    <div class="text-3xl font-bold text-green-400">67</div>
                    <div class="text-sm text-gray-400">已处理事件</div>
                    <div class="text-xs text-green-400 mt-1"><i class="fas fa-check"></i> 正常</div>
                </div>
            </div>

            <!-- 图表区域 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="glass-panel p-4">
                    <h3 class="font-semibold mb-4 flex items-center gap-2">
                        <i class="fas fa-chart-area text-blue-400"></i>合规率趋势
                    </h3>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                <div class="glass-panel p-4">
                    <h3 class="font-semibold mb-4 flex items-center gap-2">
                        <i class="fas fa-chart-pie text-purple-400"></i>违规类型分布
                    </h3>
                    <div class="chart-container">
                        <canvas id="typeChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-panel p-4">
                    <h3 class="font-semibold mb-4 flex items-center gap-2">
                        <i class="fas fa-map-marked-alt text-green-400"></i>区域合规排名
                    </h3>
                    <div id="zoneRanking" class="space-y-3"></div>
                </div>
                <div class="glass-panel p-4">
                    <h3 class="font-semibold mb-4 flex items-center gap-2">
                        <i class="fas fa-user-slash text-red-400"></i>高频违规人员
                    </h3>
                    <div id="topViolators" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const zoneStats = [
            { zone: 'zone-a', name: '洁净区A', rate: 95.2 },
            { zone: 'zone-b', name: '洁净区B', rate: 87.5 },
            { zone: 'zone-c', name: '灌装生产线', rate: 96.8 },
            { zone: 'zone-d', name: '原料仓储区', rate: 92.3 }
        ];

        const violators = [
            { name: '王建国', department: '生产部', score: 68, count: 12 },
            { name: '赵强', department: '物流部', score: 71, count: 8 },
            { name: '李秀英', department: '质量部', score: 82, count: 5 },
            { name: '张伟', department: '生产部', score: 88, count: 3 },
            { name: '刘芳', department: '生产部', score: 94, count: 1 }
        ];

        let trendChart, typeChart;

        function initCharts() {
            // 合规率趋势图
            const trendCtx = document.getElementById('trendChart');
            trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                    datasets: [{
                        label: '合规率(%)',
                        data: [91, 94, 93, 95, 92, 94, 93.8],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, min: 80, max: 100, grid: { color: 'rgba(148, 163, 184, 0.1)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });

            // 违规类型饼图
            const typeCtx = document.getElementById('typeChart');
            typeChart = new Chart(typeCtx, {
                type: 'doughnut',
                data: {
                    labels: ['卫生异常', '人数超限', '行为违规', '禁区闯入', '设备异常'],
                    datasets: [{
                        data: [45, 32, 38, 15, 26],
                        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#10b981'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#94a3b8', padding: 15, font: { size: 12 } } }
                    }
                }
            });
        }

        function renderRankings() {
            // 区域排名
            const sortedZones = [...zoneStats].sort((a, b) => b.rate - a.rate);
            document.getElementById('zoneRanking').innerHTML = sortedZones.map((z, i) => `
                <div class="flex items-center gap-3">
                    <div class="w-6 h-6 rounded-full ${i < 3 ? 'bg-yellow-500/20 text-yellow-400' : 'bg-slate-700 text-gray-400'} flex items-center justify-center text-xs font-bold">${i + 1}</div>
                    <div class="flex-1">
                        <div class="flex justify-between text-sm">
                            <span>${z.name}</span>
                            <span class="font-semibold">${z.rate}%</span>
                        </div>
                        <div class="h-2 bg-slate-700 rounded-full mt-1">
                            <div class="h-full rounded-full ${z.rate >= 95 ? 'bg-green-500' : z.rate >= 90 ? 'bg-blue-500' : 'bg-yellow-500'}" style="width:${z.rate}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');

            // 高频违规人员
            document.getElementById('topViolators').innerHTML = violators.map((p, i) => `
                <div class="flex items-center gap-3 p-2 rounded-lg bg-slate-800/30">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-500 to-orange-600 flex items-center justify-center text-sm font-bold">${p.name[0]}</div>
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <span class="text-sm font-medium">${p.name}</span>
                            <span class="text-xs ${p.score >= 90 ? 'text-green-400' : p.score >= 80 ? 'text-yellow-400' : 'text-red-400'}">${p.score}分</span>
                        </div>
                        <div class="text-xs text-gray-500">${p.department} · ${p.count}次违规</div>
                    </div>
                </div>
            `).join('');
        }

        function updateCharts() {
            const range = document.getElementById('timeRange').value;
            // 模拟数据更新
            const newData = range === '7' ? [91, 94, 93, 95, 92, 94, 93.8] : 
                           range === '30' ? [89, 91, 90, 92, 93, 94, 93.8] :
                           [92, 93, 94, 93, 95, 94, 93.8];
            trendChart.data.datasets[0].data = newData;
            trendChart.update();
        }

        function init() {
            initCharts();
            renderRankings();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
