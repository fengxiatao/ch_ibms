<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时告警 - 工厂AI视频合规管控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0e1a;
            --bg-panel: rgba(15, 23, 42, 0.85);
            --border-color: rgba(148, 163, 184, 0.15);
            --compliance-green: #10b981;
            --warning-yellow: #f59e0b;
            --violation-red: #ef4444;
            --info-blue: #3b82f6;
        }
        body { background: var(--bg-primary); color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: var(--bg-panel); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; }

        .alert-card { background: rgba(30,41,59,0.8); border-radius: 8px; padding: 16px; margin-bottom: 12px; border-left: 4px solid; transition: all 0.2s; }
        .alert-card.critical { border-left-color: var(--violation-red); background: rgba(239,68,68,0.1); }
        .alert-card.warning { border-left-color: var(--warning-yellow); background: rgba(245,158,11,0.1); }
        .alert-card:hover { transform: translateX(4px); }

        .zone-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .zone-badge.zone-a { background: rgba(139,92,246,0.2); color: #a78bfa; }
        .zone-badge.zone-b { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .zone-badge.zone-c { background: rgba(16,185,129,0.2); color: #34d399; }
        .zone-badge.zone-d { background: rgba(245,158,11,0.2); color: #fbbf24; }

        .stat-card { background: linear-gradient(135deg, rgba(59,130,246,0.1) 0%, rgba(139,92,246,0.1) 100%); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; padding: 20px; }

        .sidebar-menu-item { padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; color: #94a3b8; }
        .sidebar-menu-item:hover { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .sidebar-menu-item.active { background: rgba(59,130,246,0.25); color: #60a5fa; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; border-left: 4px solid var(--info-blue); border-radius: 8px; padding: 12px 20px; z-index: 1100; transform: translateX(400px); transition: transform 0.3s; }
        .toast.show { transform: translateX(0); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 90%; max-width: 550px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30,41,59,0.5); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- 左侧边栏 -->
    <aside class="w-72 bg-slate-900/80 border-r border-gray-800 flex flex-col shrink-0 overflow-y-auto">
        <div class="p-5 border-b border-gray-800">
            <div class="flex items-center gap-2">
                <i class="fas fa-shield-alt text-2xl text-blue-500"></i>
                <div>
                    <h1 class="text-lg font-bold">工厂AI视频合规管控</h1>
                    <p class="text-xs text-gray-500">智能合规事件管理平台</p>
                </div>
            </div>
        </div>

        <div class="px-4 py-3 border-t border-gray-800">
            <div class="text-xs text-gray-500 uppercase mb-2 font-semibold">功能模块</div>
            <div class="space-y-1">
                <div class="sidebar-menu-item" onclick="location.href='monitor.html'">
                    <i class="fas fa-desktop text-gray-400"></i>
                    <span class="text-sm">实时监控</span>
                </div>
                <div class="sidebar-menu-item active">
                    <i class="fas fa-bell text-red-400"></i>
                    <span class="text-sm">实时告警</span>
                    <span class="ml-auto bg-red-500/20 text-red-400 text-xs px-2 py-0.5 rounded-full" id="alertBadge">4</span>
                </div>
                <div class="sidebar-menu-item" onclick="location.href='events.html'">
                    <i class="fas fa-database text-gray-400"></i>
                    <span class="text-sm">事件管理</span>
                </div>
                <div class="sidebar-menu-item" onclick="location.href='analysis.html'">
                    <i class="fas fa-chart-line text-gray-400"></i>
                    <span class="text-sm">事件分析</span>
                </div>
                <div class="sidebar-menu-item" onclick="location.href='personnel.html'">
                    <i class="fas fa-users text-gray-400"></i>
                    <span class="text-sm">人员档案管理</span>
                </div>
            </div>
        </div>

        <div class="mt-auto p-4 border-t border-gray-800">
            <div class="grid grid-cols-3 gap-2 text-center">
                <div><div class="text-lg font-bold text-blue-400">6</div><div class="text-xs text-gray-500">监控点位</div></div>
                <div><div class="text-lg font-bold text-green-400">5</div><div class="text-xs text-gray-500">合规规则</div></div>
                <div><div class="text-lg font-bold text-purple-400">13</div><div class="text-xs text-gray-500">在场人员</div></div>
            </div>
        </div>
    </aside>

    <!-- 主内容区：实时告警 -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <div class="p-6 border-b border-gray-800 bg-slate-900/30">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold flex items-center gap-2">
                        <i class="fas fa-bell text-red-400"></i>实时告警
                    </h2>
                    <p class="text-gray-500 text-sm mt-1">AI实时检测到的合规异常告警</p>
                </div>
                <div class="flex gap-2">
                    <select id="alertLevelFilter" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" onchange="renderAlerts()">
                        <option value="all">全部级别</option>
                        <option value="critical">严重</option>
                        <option value="warning">警告</option>
                    </select>
                    <button class="px-4 py-2 bg-blue-600/20 text-blue-400 border border-blue-600/30 rounded-lg text-sm hover:bg-blue-600/30" onclick="refreshAlerts()">
                        <i class="fas fa-sync-alt mr-1"></i>刷新
                    </button>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            <!-- 统计卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="stat-card" style="background: linear-gradient(135deg, rgba(239,68,68,0.1) 0%, rgba(239,68,68,0.05) 100%); border-color: rgba(239,68,68,0.2);">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-3xl font-bold text-red-400" id="countCritical">0</div>
                            <div class="text-sm text-gray-400">严重告警</div>
                        </div>
                        <i class="fas fa-exclamation-triangle text-3xl text-red-400/30"></i>
                    </div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, rgba(245,158,11,0.1) 0%, rgba(245,158,11,0.05) 100%); border-color: rgba(245,158,11,0.2);">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-3xl font-bold text-yellow-400" id="countWarning">0</div>
                            <div class="text-sm text-gray-400">警告告警</div>
                        </div>
                        <i class="fas fa-exclamation-circle text-3xl text-yellow-400/30"></i>
                    </div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, rgba(16,185,129,0.05) 100%); border-color: rgba(16,185,129,0.2);">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-3xl font-bold text-green-400" id="countResolved">0</div>
                            <div class="text-sm text-gray-400">今日已处理</div>
                        </div>
                        <i class="fas fa-check-circle text-3xl text-green-400/30"></i>
                    </div>
                </div>
            </div>

            <!-- 告警列表 -->
            <div id="alertList" class="space-y-3"></div>
        </div>
    </main>

    <!-- 处理模态框 -->
    <div id="handleModal" class="modal-overlay">
        <div class="modal-content p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold text-lg">处理告警</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalContent" class="space-y-3"></div>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600">取消</button>
                <button onclick="confirmHandle()" class="px-4 py-2 bg-green-600 rounded-lg text-sm hover:bg-green-700">确认处理</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <div class="flex items-center gap-2">
            <i id="toastIcon" class="fas fa-check-circle text-green-400"></i>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script>
        let alerts = [
            { id: 1, type: 'hygiene', level: 'critical', title: '洁净服穿戴异常', description: '检测到人员未正确佩戴口罩', camera: 'CAM-01', zone: 'zone-a', location: 'A区洁净区入口', time: '2024-03-28 09:15:23', person: '王建国', snapshot: 'https://picsum.photos/id/20/100/80' },
            { id: 2, type: 'count', level: 'warning', title: '区域人数超限', description: 'B区作业区当前人数4人，超出上限3人', camera: 'CAM-03', zone: 'zone-b', location: 'B区洁净作业区', time: '2024-03-28 10:45:12', person: null, snapshot: 'https://picsum.photos/id/26/100/80' },
            { id: 3, type: 'behavior', level: 'warning', title: '违规操作行为', description: '检测到人员裸手接触原料', camera: 'CAM-04', zone: 'zone-b', location: 'B区关键工位', time: '2024-03-28 11:30:45', person: '李秀英', snapshot: 'https://picsum.photos/id/29/100/80' },
            { id: 4, type: 'intrusion', level: 'critical', title: '禁区闯入告警', description: '未授权人员进入原料仓储区', camera: 'CAM-06', zone: 'zone-d', location: 'D区原料仓储区', time: '2024-03-28 13:20:08', person: '赵强', snapshot: 'https://picsum.photos/id/31/100/80' }
        ];

        let currentAlertId = null;

        function showToast(msg, type='success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msgEl = document.getElementById('toastMessage');
            const icons = { success: 'fa-check-circle text-green-400', warning: 'fa-exclamation-circle text-yellow-400', error: 'fa-times-circle text-red-400', info: 'fa-info-circle text-blue-400' };
            icon.className = `fas ${icons[type]}`;
            msgEl.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function renderAlerts() {
            const levelFilter = document.getElementById('alertLevelFilter').value;
            let filtered = alerts;
            if (levelFilter !== 'all') filtered = filtered.filter(a => a.level === levelFilter);

            document.getElementById('countCritical').textContent = alerts.filter(a => a.level === 'critical').length;
            document.getElementById('countWarning').textContent = alerts.filter(a => a.level === 'warning').length;
            document.getElementById('countResolved').textContent = Math.floor(Math.random() * 10) + 5;
            document.getElementById('alertBadge').textContent = alerts.length;

            const container = document.getElementById('alertList');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500"><i class="fas fa-check-circle text-4xl mb-3 text-green-400"></i><p>暂无待处理告警</p></div>';
                return;
            }

            container.innerHTML = filtered.map(a => `
                <div class="alert-card ${a.level}">
                    <div class="flex justify-between items-start">
                        <div class="flex gap-4">
                            <img src="${a.snapshot}" class="w-24 h-20 rounded object-cover">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-semibold">${a.title}</span>
                                    <span class="px-2 py-0.5 rounded text-xs ${a.level === 'critical' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400'}">${a.level === 'critical' ? '严重' : '警告'}</span>
                                </div>
                                <p class="text-sm text-gray-400 mb-2">${a.description}</p>
                                <div class="flex items-center gap-3 text-xs text-gray-500">
                                    <span class="zone-badge zone-${a.zone.split('-')[1]}">${a.camera}</span>
                                    <span><i class="fas fa-map-marker-alt mr-1"></i>${a.location}</span>
                                    <span><i class="fas fa-clock mr-1"></i>${a.time}</span>
                                    ${a.person ? `<span><i class="fas fa-user mr-1"></i>${a.person}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="openHandleModal(${a.id})" class="px-4 py-2 bg-green-600/20 text-green-400 border border-green-600/30 rounded-lg text-sm hover:bg-green-600/30">
                                <i class="fas fa-check mr-1"></i>处理
                            </button>
                            <button onclick="viewDetail(${a.id})" class="px-4 py-2 bg-blue-600/20 text-blue-400 border border-blue-600/30 rounded-lg text-sm hover:bg-blue-600/30">
                                <i class="fas fa-eye mr-1"></i>详情
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function refreshAlerts() {
            renderAlerts();
            showToast('告警列表已刷新', 'success');
        }

        function openHandleModal(alertId) {
            currentAlertId = alertId;
            const alert = alerts.find(a => a.id === alertId);
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="p-3 bg-slate-800/50 rounded-lg">
                    <div class="font-medium mb-1">${alert.title}</div>
                    <div class="text-sm text-gray-400">${alert.description}</div>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">处理方式</label>
                    <select id="handleMethod" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                        <option value="">请选择</option>
                        <option value="现场检查">现场检查</option>
                        <option value="人员提醒">人员提醒</option>
                        <option value="设备检修">设备检修</option>
                        <option value="培训教育">培训教育</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">处理备注</label>
                    <textarea id="handleRemark" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" rows="3" placeholder="请输入处理备注..."></textarea>
                </div>
            `;
            document.getElementById('handleModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('handleModal').classList.remove('active');
            currentAlertId = null;
        }

        function confirmHandle() {
            const method = document.getElementById('handleMethod').value;
            if (!method) { showToast('请选择处理方式', 'warning'); return; }

            alerts = alerts.filter(a => a.id !== currentAlertId);
            renderAlerts();
            closeModal();
            showToast('告警已处理', 'success');
        }

        function viewDetail(alertId) {
            showToast('查看告警详情', 'info');
        }

        function init() {
            renderAlerts();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
